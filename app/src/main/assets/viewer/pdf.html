<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PDF document</title>
<!-- Deliberately no viewport meta, unlike the other viewers. Without one the
     WebView lays out at its default 980 CSS px and loadWithOverviewMode zooms
     that down to fit, which on a Nothing Phone 2 puts one CSS px at about 1.1
     device px and gives a pinch range of about 10x rather than 5x.

     This used to be a sharpness argument as well. Every page was drawn at twice
     the layout width so a pinch had spare pixels to magnify, and the 922 px a
     width=device-width layout would lay out at was fewer of them. It is not
     that any more: a page is drawn at the resolution the screen actually has,
     and the part of it being looked at is drawn again at whatever zoom the
     reader reaches, so the pinch range is the whole of what this width buys. -->
<link rel="stylesheet" href="app.css">
<style>
  /* The surround a page is read against. Warm, to match the rest of the app, and
     matched on lightness rather than picked by eye: this is L* 29.0 where the Blue Grey
     700 it replaces was 29.1, so a page sits against exactly as much contrast as it did
     before and only the temperature has moved. */
  body { background: #48443D; }

  /* The strip between two pages. One declaration, three consumers: .pg's margin draws
     it, .vw-gap bridges it so a selection can cross it, and PAGE_PITCH counts it into
     the draw and keep bands. They disagreeing is a bug in each of those three ways. */
  :root { --pg-gap: 8px; }

  /*
   * Where the document sits when there is less of it than there is screen.
   *
   * A single A4 page fitted to the width of a phone is about 1.4 screen widths tall
   * where the screen is about 2.2, so a one-page PDF stood at the top with a third of
   * the display left as surround below it. Every viewer of a fixed sheet puts one in
   * the middle instead, imgweb.html here included, so this makes a page agree with a
   * photograph.
   *
   * One static rule, and nothing measured, which is the whole reason it is written this
   * way. min-height leaves the container free to grow, so a document taller than the
   * screen has no free space, justify-content has nothing to distribute, and the layout
   * is the one that was there before. Only a document that already fits moves.
   *
   * On #pages rather than on the body, where the same centring would be shorter to
   * write. #vw-status is a child of the body and not of this, and is placed against
   * the screen by app.css rather than by the flow, so the rendering card, the error
   * card and the password prompt are no concern of this rule either way.
   *
   * Two details are load bearing. border-box, or the 8px of padding would fall outside
   * the 100vh and give every short document sixteen pixels of rubber band to pull
   * against. And flex: none, so that a column flex container can never decide to shrink
   * a page out of the aspect-ratio it was measured at.
   *
   * 100vh, and not the --vw-fit that pptx.html and docx.html centre against, because
   * here it is exactly right. Those two size a page from the document and can end up
   * wider than the 980 CSS px this WebView lays out at, which moves the height the
   * reader can see out from under 100vh; see vwFitHeight() in app.js. A .pg is
   * width: 100%, so this file can never be wider than the layout viewport and the two
   * numbers cannot come apart. Measured on the phone: innerHeight and 100vh both 1886.
   */
  #pages {
    box-sizing: border-box;
    padding: 8px 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  #pages > .pg { flex: none; }

  /*
   * Night mode, issue #19. Two colours here; the picture on the page is turned over
   * by recolour() in the module, against the filter at the top of the body.
   *
   * The paper is worth setting even though the canvas that covers it is always opaque:
   * a page that has not been drawn yet is this box and nothing else, so without it
   * every page ahead of the reader is a white rectangle until it is drawn, which is the
   * one thing somebody reading in the dark turned this on to avoid.
   *
   * The surround goes to the ground app.css uses in dark mode, so the page is the
   * darkest thing on screen and its edges still show. The shadow below stops doing
   * anything at these two colours, and is left alone rather than fought with.
   */
  html.vw-night body { background: #17130A; }
  html.vw-night .pg { background: #000; }
  /*
   * The cards go over too, and they have to be named here rather than left to
   * app.css. Those tokens turn over with the *system* scheme, and night mode exists
   * for a reader whose system is not dark: without this, asking for the password on
   * an encrypted PDF puts a card most of the screen wide, white, with a white input
   * in it, on an otherwise black page, and it stays there until they type.
   *
   * The values are app.css's own night tokens, so a phone that is in dark mode sees
   * no change and the two routes agree.
   */
  html.vw-night .vw-status { background: #2D2A23; color: #E7E2D9; }
  html.vw-night .vw-status.vw-error { background: #8C1D18; color: #F9DEDC; }
  html.vw-night .vw-ask-input { background: #17130A; color: #E7E2D9; border-color: #6B6250; }
  html.vw-night .vw-ask-alert { color: #F9DEDC; }

  /* Holds the filter and nothing else. Copied from how pdf.js hides the filters its
     own high-contrast mode builds, because that is the same engine resolving the same
     kind of reference from the same place. */
  #vw-filters {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    visibility: hidden;
    contain: strict;
    z-index: -1;
  }
  /*
   * A page is a box holding two layers: the canvas that is the picture of it, and
   * the text layer that is the words in it, the second sitting exactly on top of
   * the first. The box carries the size for both, which is what makes it the thing
   * the observers watch and the thing that holds its shape while empty.
   *
   * The canvas used to be this box itself. It stopped being so the text layer had
   * something to be positioned against: absolute positioning needs a positioned
   * ancestor, and a canvas cannot be one for something outside it.
   */
  .pg {
    position: relative;
    display: block;
    margin: 0 auto var(--pg-gap);
    background: #fff;
    box-shadow: 0 1px 6px rgba(0,0,0,0.35);
    width: 100%;
    max-width: 100%;
    /*
     * The shape of a page that has not been drawn yet.
     *
     * A canvas with no width or height attribute is 300x150, the HTML default, and
     * an undrawn page standing at 300x150 was the whole of the bug this viewer had:
     * visible as a column of small white boxes when a reader outran the renderer,
     * and small enough that the look-ahead band held about fifty pages where it
     * should hold a handful, every one of which began rendering at once.
     *
     * Page 1's shape is published here as a custom property once the document opens,
     * so a 357-page document costs one write rather than one per page, and a page
     * that has been drawn overrides it inline with its own. The fallback is A4
     * portrait and applies only between the boxes existing and page 1 being
     * measured, which is spent behind the "Rendering document" card.
     *
     * On the box rather than the canvas now. The canvas fills the box, so a released
     * page whose canvas is 0x0 still stands at its full height and nothing moves.
     */
    aspect-ratio: var(--pg-ratio, 0.7071);
  }

  /*
   * The strip between two pages, made part of the page above it.
   *
   * That gap is .pg's own margin, so it belongs to #pages and lies inside no text
   * layer. A finger crossing it is over no span, and Blink answers a container with
   * nothing in flow with the same position wherever it is asked, which here is a whole
   * page. Traced at a page boundary: a selection went from 236 characters to 3895 in
   * one event and the view scrolled 804px to follow it, which looked like a scroll bug
   * and was the original runaway surviving in the one place padRows() cannot reach.
   *
   * A sibling of the text layer rather than part of it, and this is the whole reason it
   * is a separate element. pdf.js positions every span with a percentage top, so making
   * the layer eight pixels taller moves every word down by a fraction of eight pixels,
   * most at the foot of the page. That was tried, and the selection came away from the
   * text everywhere. The layer's height is load bearing and cannot be touched; a
   * sibling inside .pg costs nothing and escapes the layer's overflow: clip.
   *
   * Last in .pg, so that in document order it falls after every word on this page and
   * before the first word of the next, which is what a caret landing in it should mean.
   */
  .pg > .vw-gap {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    height: var(--pg-gap);
    /*
     * Selectable, and that is a guard rather than a statement of the default.
     *
     * Nothing here sets user-select: none on an ancestor of this, so the caret lands in
     * it either way; measured, and the seam reads identically with this line reverted.
     * It is declared so that staying true is a property of this rule rather than of
     * what the rest of the stylesheet happens not to say, the same argument as the
     * spacing properties on .hiddenCanvasElement. Without it, an ancestor rule added
     * later would silently reopen the strip.
     */
    user-select: text;
  }

  .pg > canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /*
   * The sharp patch.
   *
   * The canvas above is drawn once, at the resolution the screen has with the page
   * fitted to its width, and pinching in is the compositor magnifying that bitmap.
   * Past a point it has no pixels left to magnify, so the part of the page being
   * looked at is drawn a second time, at the zoom the reader has actually reached,
   * and laid over the top. That second picture is this.
   *
   * Placed in percentages of the box rather than in pixels. .pg is a percentage width
   * carrying an aspect-ratio, so its box is fractional; a percentage resolves against
   * the same fractional box the canvas underneath fills, where px would round away
   * from it and leave the two pictures half a device pixel apart, which is exactly the
   * detail this exists to recover. Left, top, width and height are written inline once
   * the tile is drawn, and beat the rule above.
   *
   * z-index is stated rather than left to tree order, because the text layer carries
   * one too and the words have to stay over the picture.
   *
   * pointer-events and aria-hidden say the same thing twice, once to the finger and once
   * to a screen reader: this is a second copy of a picture that is already there, and it
   * is not a thing in its own right. Without the first it would sit between the text
   * layer and a touch meant for selecting a word; without the second a reader would be
   * told about two canvases per page instead of one.
   */
  .pg > canvas.tile {
    position: absolute;
    z-index: 0;
    pointer-events: none;
  }

  /*
   * The text layer: pdf.js's own, positioned over the picture.
   *
   * These rules are not decoration, they are the contract the TextLayer class in
   * lib/pdf.min.mjs is written against. It sets left, top, font-size and a transform
   * inline on each span and expects the stylesheet to supply the rest, so a viewer
   * that omits them gets its text stacked in the corner rather than laid over the
   * page. Re-check them when pdf.js moves; see "Before upgrading pdf.js" in
   * docs/VENDORED.md.
   *
   * The scale hook this build reads is --total-scale-factor. The older
   * --scale-factor does not appear anywhere in 5.7.284 and setting it does nothing,
   * which fails quietly as text half a page out of place.
   */
  .textLayer {
    position: absolute;
    /*
     * inset is what sizes this layer, and that is not the arrangement pdf.js intends.
     *
     * setLayerDimensions() writes width and height inline on this element as
     * round(down, var(--total-scale-factor) * <pageWidth>px, var(--scale-round-x)).
     * --scale-round-x is upstream's, is not defined here, and an undefined var()
     * makes the whole declaration invalid at computed-value time, so both fall back
     * to auto and the insets decide. That is the better answer rather than an
     * accident worth repairing: .pg is a percentage width with an aspect-ratio, so
     * its box is fractional, and defining --scale-round-x would make those inline
     * declarations valid, beat right and bottom, and floor a 1268.235px box to 1268px
     * behind an overflow: clip.
     *
     * So leave it undefined, and know that this line is load bearing. A pdf.js that
     * stops writing round() would put the two back in charge and nothing here would
     * say so.
     */
    inset: 0;
    overflow: clip;
    line-height: 1;
    text-align: initial;
    text-size-adjust: none;
    forced-color-adjust: none;
    transform-origin: 0 0;
    caret-color: CanvasText;
    z-index: 0;

    /* Read by the span rule below. --total-scale-factor is set per page in
       textLayerFor(); the other two exist because pdf.js's own stylesheet defines
       the size and transform in terms of them. */
    --min-font-size: 1;
    --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
    --min-font-size-inv: calc(1 / var(--min-font-size));
  }

  .textLayer span,
  .textLayer br {
    /*
     * The words are invisible and still selectable, because the picture underneath
     * already shows them. Colour them and every glyph would be drawn twice, once by
     * the renderer and once by the browser, in fonts that do not match.
     *
     * Held in a custom property rather than written here, the way GrapheneOS's
     * PdfViewer does it, so the layer can be made visible to look at. Setting
     * --text-layer-foreground to red on the root paints the words this layer thinks
     * are there over the ones the renderer drew, which is the only direct way to see
     * whether the two agree. There is no control for it: it is a debugging handle,
     * reachable from devtools, and it costs one variable to leave in.
     */
    color: var(--text-layer-foreground, transparent);
    position: absolute;
    white-space: pre;
    cursor: text;
    transform-origin: 0% 0%;
  }

  /*
   * Where a span gets its size and width, and the half of the contract that is easy
   * to miss.
   *
   * pdf.js writes only left, top, font-family and three custom properties on each
   * span: --font-height, --scale-x and --rotate. It never writes font-size or
   * transform. Those are the stylesheet's job, and without them every span renders at
   * the inherited 16px with no horizontal scaling, which does not throw and does not
   * look broken, because the text is transparent and the picture underneath is still
   * correct. It shows up only when something draws on the text: a selection that
   * covers the wrong words, or a search hit whose highlight stops short of the end of
   * the word it found.
   *
   * --scale-x is measured, not declared: pdf.js renders the run in whatever font the
   * device actually has, measures it, and divides the width the PDF asked for by the
   * width it got. That is why this has to be applied rather than approximated, and
   * why the same page is right on two phones with different fonts installed.
   *
   * The selector is pdf.js's own. Marked content arrives as a wrapping element that
   * is display:contents, so its spans are addressed separately rather than by depth.
   */
  .textLayer > :not(.markedContent),
  .textLayer .markedContent span:not(.markedContent) {
    z-index: 1;
    --font-height: 0;
    --scale-x: 1;
    --rotate: 0deg;
    font-size: calc(var(--text-scale-factor) * var(--font-height));
    transform:
      rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
  }

  .textLayer .markedContent { display: contents; }

  /*
   * The colour a selection is drawn in, which is the viewer's rather than the
   * platform's. pdf.js styles only the background here and lets the selected text keep
   * whatever colour it had, which in this layer is transparent, because the picture
   * underneath is already showing the words. Left out, a selection comes back in the
   * WebView's own grey.
   *
   * The second rule is for the line breaks pdf.js puts between runs. They carry no
   * text of their own, so a highlight on one is a block of colour past the end of a
   * line.
   */
  .textLayer ::selection {
    background: rgba(33, 150, 243, 0.35);
  }
  .textLayer br::selection { background: transparent; }

  /* An image standing in for text is not text to select. */
  .textLayer span[role="img"] { user-select: none; cursor: default; }

  /*
   * pdf.js's measuring canvas, which is not part of any page.
   *
   * TextLayer appends one of these to the body and reads glyph widths off it to
   * compute --scale-x. Upstream's stylesheet hides it and ours did not, so it stood
   * in the body at the HTML default 300x150 until the first measurement zeroed its
   * backing store. A 2D context does not care about layout, which is why it can be
   * hidden and still measure.
   *
   * The two spacing properties are upstream's too, and are the half worth
   * understanding: this element inherits from the body, and inherited letter-spacing
   * reaches measureText and corrupts the width every --scale-x is derived from.
   * Nothing here sets either, so nothing is wrong today. They are declared so that
   * stays a property of this rule rather than of what the rest of the stylesheet
   * happens not to say.
   */
  .hiddenCanvasElement {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    display: none;
    letter-spacing: normal;
    word-spacing: normal;
  }

  /*
   * Search hits. Registered as Ranges through CSS.highlights rather than by wrapping
   * the text in elements: wrapping would split the spans pdf.js positioned and move
   * the words off the picture, which is the one thing the text layer must never do.
   */
  ::highlight(vw-find) {
    background-color: rgba(255, 213, 79, 0.45);
  }
  ::highlight(vw-find-active) {
    background-color: rgba(255, 145, 0, 0.62);
  }

  /*
   * This page is not in the coordinate space app.css writes its card for. There is
   * no viewport meta (see the note in the head), so the WebView lays out at 980 CSS
   * px and loadWithOverviewMode zooms that down to fit, which shrinks a card written
   * in dp along with everything else. app.css multiplies the card back up by this;
   * the number, and why it is this number, is documented beside the token there. It
   * is used again below by the password prompt, which is this file's own.
   */
  :root { --vw-zoom: 2.75; }

  /* The password prompt. Left in this file rather than app.css because a
     password is a PDF concern: no other viewer here can be handed an encrypted
     document it knows how to unlock. */
  .vw-ask { text-align: left; }
  .vw-ask-title { font-weight: 600; margin-bottom: calc(6px * var(--vw-zoom)); }
  .vw-ask-label {
    display: block;
    font-size: calc(13px * var(--vw-zoom));
    opacity: 0.85;
    margin-bottom: calc(10px * var(--vw-zoom));
  }
  /* The retry line, in the error red rather than the label's grey: it reports
     something that went wrong, where the label only instructs. */
  .vw-ask-alert {
    display: block;
    font-size: calc(13px * var(--vw-zoom));
    color: #8c1d18;
    margin-bottom: calc(10px * var(--vw-zoom));
  }
  .vw-ask-row { display: flex; gap: calc(8px * var(--vw-zoom)); }
  .vw-ask-input {
    /* min-width:0 or the input refuses to shrink under its intrinsic size and
       pushes the button out of the card on a narrow layout. */
    flex: 1 1 auto;
    min-width: 0;
    font: inherit;
    /* Stated rather than left to fall out of font and padding, which lands at
       about 36 dp once zoomed where Android asks for 48. Sized at the 0.37 end,
       where the zoom is smallest and the target is therefore tightest. */
    box-sizing: border-box;
    min-height: calc(48px * var(--vw-zoom));
    padding: 0 calc(10px * var(--vw-zoom));
    border: calc(1px * var(--vw-zoom)) solid #CFC5B2;
    border-radius: calc(6px * var(--vw-zoom));
    background: #fff;
    color: #1E1B15;
  }
  .vw-ask-btn {
    flex: 0 0 auto;
    font: inherit;
    box-sizing: border-box;
    min-height: calc(48px * var(--vw-zoom));
    padding: 0 calc(16px * var(--vw-zoom));
    border: 0;
    border-radius: calc(6px * var(--vw-zoom));
    /* The brand accent, like every other primary action in the app. */
    background: #AF2D18;
    color: #fff;
  }
</style>
</head>
<body>
<!--
 * The colour a page is turned over with, issue #19.
 *
 * invert(1) on its own flips lightness and hue together, so a blue heading comes back
 * orange and a red curve comes back cyan. This is invert composed with
 * hue-rotate(180deg), spelled out rather than asked for by name: ctx.filter can only
 * reference a filter element, and a matrix written here is the same matrix on every
 * engine, where a named function is whatever that engine implements.
 *
 * All three rows sum to -1, which with the +1 in the offset column sends a grey g to
 * 1 - g: the same distance from the other end, and still grey rather than picking up a
 * cast. That is the invariant to check if this is ever edited. White
 * paper lands on black, body text at 20,20,20 lands on 235,235,235, and a heading at
 * 0,119,199 lands on 56,175,255 with its hue held at 204 degrees and only its
 * lightness moved, 0.39 to 0.61.
 *
 * sRGB is not the default and is not optional. The SVG default is linearRGB, which
 * would change the lightness response and read the offset column in the wrong space.
 -->
<div id="vw-filters" aria-hidden="true">
  <svg width="0" height="0"><defs>
    <filter id="vw-invert" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
         0.574 -1.430 -0.144 0 1
        -0.426 -0.430 -0.144 0 1
        -0.426 -1.430  0.856 0 1
         0      0      0     1 0"/>
    </filter>
  </defs></svg>
</div>
<div id="vw-status" class="vw-status">Rendering document…</div>
<div id="pages"></div>
<script src="app.js"></script>
<script>
/*
 * Classic on purpose, and ahead of the module. What draws a PDF is an ES module,
 * and a WebView too old to parse one never runs a line of it, so no handler
 * inside the module can report that the module never loaded. What the reader
 * gets instead is app.js's window.onerror: "Something went wrong while
 * rendering", followed by a parser complaint naming a file they have never heard
 * of. Checked in headless Chrome by importing a module with syntax it rejects.
 * So whatever says "your WebView is too old" cannot itself live in the module.
 *
 * Kotlin adds webview=<major>&needs=<floor> only when the engine about to render
 * is older than the vendored pdf.js supports. That is a version read from the
 * system rather than a timeout or a feature sniff, so the same phone gets the
 * same answer every time. See PDFJS_MIN_CHROMIUM_MAJOR in ViewerActivity.kt for
 * where the number comes from.
 *
 * It adds locked=1 when the reader has no way to update the WebView, which is
 * the case on a phone whose manufacturer supplies it and allows no replacement.
 * Telling those readers to go and update it is the one thing the card must not
 * do. On such a phone the version sometimes cannot be read at all, and then
 * locked=1 arrives without a major beside it, which is why what follows gates on
 * either parameter rather than on the version.
 */
function vwNeedsNewerWebView(have, needs, locked) {
  if (locked) {
    vwError(
      "PDFs cannot be shown on this phone",
      "Every other format Gander opens still works. " +
      // No floor is written here. The number arrives in the query string so that
      // raising PDFJS_MIN_CHROMIUM_MAJOR stays a one-constant edit, which means
      // the sentence has to work without it too.
      (needs
        ? "PDFs need the browser engine built into your phone to be version " +
          needs + " or newer, and this one is " + (have || "older") + ". "
        : "PDFs need a newer browser engine than the one built into your phone. ") +
      "On this phone that engine comes from the manufacturer and cannot be " +
      "updated or replaced, so installing Android System WebView will not help."
    );
    return;
  }
  vwError(
    "Android System WebView is too old to show PDFs",
    "Gander draws PDFs using Android System WebView, the browser engine built " +
    "into your phone. " +
    (have && needs
      ? "This one is version " + have + " and the PDF renderer needs " +
        needs + " or newer. "
      : "This one is too old to run the PDF renderer. ") +
    "Updating Android System WebView and reopening the file will fix it. " +
    "Every other format Gander opens still works."
  );
}

/* Global on purpose: the module below reads it, and it has to be set by a
   script that is guaranteed to have parsed. */
var vwPdfBlocked = !!(vwParams.get("webview") || vwParams.get("locked"));
if (vwPdfBlocked) {
  vwNeedsNewerWebView(
    vwParams.get("webview"),
    vwParams.get("needs"),
    vwParams.get("locked")
  );
}

/*
 * Night mode, and set here rather than in the module for the same reason as everything
 * else in this script: the module is fetched and parsed after this runs, and every page
 * laid out in between would be a white rectangle. Global on purpose, the module reads
 * it once and owns it from then on.
 */
var vwNight = vwParams.get("night") === "1";
if (vwNight) document.documentElement.classList.add("vw-night");
</script>
<script nomodule>
/*
 * Runs only where ES modules are not supported at all, which is Chromium below
 * 61, far under the pdf.js floor, and where the module below is never fetched.
 * Only reachable when Kotlin could not read the WebView version, because when it
 * can, the check above has already said the same thing with the numbers filled
 * in. Six lines of belt and braces that any module-capable engine skips.
 */
if (!vwPdfBlocked) vwNeedsNewerWebView(null, null, vwParams.get("locked"));
</script>
<script type="module">
import * as pdfjsLib from "./lib/pdf.min.mjs";

/* The worker keeps parsing off the UI thread; without it pdf.js falls back to
   doing everything inline and large documents visibly stall. */
pdfjsLib.GlobalWorkerOptions.workerSrc = "./lib/pdf.worker.min.mjs";

var pages = document.getElementById("pages");

/*
 * The width every page is laid out at, read once.
 *
 * There is no viewport meta, so this is Chromium's fixed 980 CSS px default and

  if (n < PROBE_MIN_SAMPLES) return false;
  return (sat / n) < PROBE_SATURATION && (pale / n) > PROBE_PAPER;
}

/*
 * Turn a finished bitmap over, all of it but the pictures.
 *
 * Plain source-over is right because the bitmap is opaque: pdf.js fills the canvas with
 * the background colour before the first operator whatever the page does afterwards, and
 * a page that draws with transparency is composed onto that fill rather than instead of
 * it. The transform is set rather than assumed; pdf.js restores the one it made, but
 * inheriting a stray one here would put the whole page back down somewhere else.
 */
function recolour(ctx, keep) {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  /*
   * Everything, less the pictures: one hole at a time, and that is the whole of why
   * this is a loop rather than a single path.
   *
   * Putting every picture into one even-odd path is the obvious way to write it and is
   * wrong where two of them overlap. Even-odd counts crossings, so the canvas plus two
   * holes is three, which is odd, which is inside: the overlap gets turned over while
   * both pictures around it are left alone. Two copies of one image at the same place -
   * which a PDF is free to emit - come to the same three, and the whole picture inverts.
   *
   * Clipping is an intersection, so a hole at a time gives everything-but-A intersected
   * with everything-but-B, which is everything but the two of them together, however
   * they lie. Nonzero winding does not fix it either: the overlap counts -1 there, which
   * is also inside.
   */
  for (var i = 0; i < keep.length; i++) {
    var q = keep[i];
    ctx.beginPath();
    ctx.rect(0, 0, ctx.canvas.width, ctx.canvas.height);
    ctx.moveTo(q[0], q[1]);
    ctx.lineTo(q[2], q[3]);
    ctx.lineTo(q[4], q[5]);
    ctx.lineTo(q[6], q[7]);
    ctx.closePath();
    ctx.clip("evenodd");
  }
  ctx.filter = "url(#vw-invert)";
  ctx.drawImage(ctx.canvas, 0, 0);
  ctx.restore();
}

/*
 * The reader turned night mode on or off.
 *
 * Every page holding a bitmap drawn in the other mode is given up and asked for again,
 * rather than filtered a second time to put it back. The matrix is its own inverse on
 * paper, but a saturated colour clamps on the way out and does not come back: red at
 * 200,30,30 wants 1.265 of a red channel and gets 1.0, and a second pass returns
 * something else. Draw it again.
 *
 * Pages part-way through a render are left where they are. draw() reconciles them when
 * they land, which is also what makes toggling twice in a second come out right: the
 * mode is read again at the end of every render, so the last one the reader chose wins
 * however many are in flight behind it.
 *
 * Tiles come back on their own. blank() drops the one a page is holding, and draw()
 * asks for a new one as it finishes.
 */
function setNight(on) {
  if (on === inverted) return;
  inverted = on;
  document.documentElement.classList.toggle("vw-night", on);
  for (var i = 0; i < slots.length; i++) {
    var s = slots[i];
    if (s.state === "drawn" && s.mode !== inverted) { blank(s); want(s); }
  }
  pump();
}

function draw(slot) {
  slot.state = "drawing";
  inFlight++;
  /* The mode this bitmap is being drawn in, which is not necessarily the mode by the
     time it lands. Read once here and compared once at the end. */
  var mode = inverted;
  return doc.getPage(slot.n).then(function (page) {
    slot.page = page;

    var unscaled = page.getViewport({ scale: 1 });
    /* Correct the placeholder to this page's own shape. Page 1's shape was a
       stand-in for it until now, and in a document of uniform pages it was exact. */
    shape(slot.box, unscaled);
    /* Kept because a tile has to be able to build a viewport for this page later,
       without another round trip for a matrix that has already been built. Dropped in
       blank() with everything else the page was holding. */
    slot.unscaled = unscaled;

    /*
     * Three scales now, and no two of them are the same number.
     *
     * This canvas is a bitmap and wants device pixels, so it is drawn at baseScale()
     * times the layout width: the resolution the screen has with the page fitted to its
     * width. The tile drawn over it later wants device pixels too, but at whatever the
     * live pinch needs, which is larger the moment anybody zooms in. The text layer is
     * DOM and wants CSS pixels: it has to land on the box, which is PAGE_WIDTH wide
     * whatever the bitmaps behind it are. Hand the text layer a canvas viewport and
     * every word lands at a multiple of its offset, off the bottom of the page.
     *
     * Keep all three apart. This note used to say that the blur fix in #20 would change
     * the canvas scale and must not be allowed to collapse two of these into one. It
     * did change the canvas scale, and that is still the way to break this.
     */
    var cssScale = PAGE_WIDTH / unscaled.width;
    var scale = cssScale * baseScale();
    scale *= within(unscaled.width * scale, unscaled.height * scale, BASE_MAX_PIXELS);
    /* clone rather than a second getViewport: the same matrix, already built. */
    var viewport = unscaled.clone({ scale: scale });
    var canvas = slot.canvas;
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    /* Held rather than asked for twice: recolour() below wants the same context, and
       getContext is a lookup on every call for a handle that never changes. */
    var ctx = canvas.getContext("2d");
    slot.task = page.render({
      canvasContext: ctx,
      viewport: viewport,
      /* Asked for only when it is going to be used. The tracker is allocated per render
         and every image on the page pays a bounding box into it, so ordinary daylight
         reading does not carry the cost. pdf.js records once per page object and keeps
         the answer, which is why a page turned over twice measures itself once. */
      recordImages: mode
    });
    return slot.task.promise.then(function () {
      if (mode) {
        var quads = imageQuads(page, canvas.width, 0, canvas.height, 0);
        var sample = quads.length ? pageSample(ctx) : null;
        /*
         * Judged here, on the whole page, and remembered for the tiles.
         *
         * A tile holds only the part of an image that falls inside it, and a corner of a
         * photograph can measure very differently from all of it: the sky alone is pale
         * and unsaturated and would be read as paper. One verdict per image per page,
         * taken where the whole thing is visible, is also the only way the tile and the
         * page underneath it can agree about what to turn over.
         */
        slot.pictures = quads.map(function (q) { return !looksLikePaper(sample, q); });
        recolour(ctx, quads.filter(function (q, i) { return slot.pictures[i]; }));
      }
      slot.mode = mode;
      return textLayerFor(slot, page, unscaled.clone({ scale: cssScale }));
    });
  }).then(function () {
    slot.state = "drawn";
    /*
     * Night mode moved while this was being drawn, so the picture that just arrived is
     * of the wrong one. Give it up and ask again; the mode is read afresh at the top of
     * draw(), so this converges however many times the reader taps.
     *
     * Here rather than in setNight() because a render in flight cannot be told to change
     * its mind, and cancelling it would put this page down the same failure path a fling
     * uses, which is the hottest one in the file and not somewhere to add a special case.
     */
    if (slot.mode !== inverted) {
      blank(slot);
      want(slot);
      return;
    }
    /* A page can come back after being released with a search still running, so
       the hits on it have to be put back: a Range does not survive its nodes. Whole
       registry rather than this page's part of it, because that is one code path
       over about eleven drawn pages rather than two that have to agree. */
    if (finding.query) { paint(); reveal(); }
    /* A page arriving while the reader is pinched in wants its sharp patch, and no
       event is going to say so: they are holding still, waiting for this. */
    scheduleRefine();
  }, function () {
    /* Cancelled or genuinely broken. Both end the same way: nothing held, and free
       to be asked for again if the reader comes back to it. */
    blank(slot);
  }).then(function () {
    slot.task = null;
    inFlight--;
    pump();
  });
}

/*
 * Drawing the page again, at the zoom the reader is actually at.
 *
 * Everything above draws a page once. Pinch zoom is Chromium's compositor magnifying
 * that bitmap, so past the point where it runs out of pixels the reader is looking at an
 * upscale. That was issue #20: two A3 tube maps, which have to be taken to six or ten
 * times before a station name is legible at all, held up against MuPDF, which redraws.
 *
 * Redrawing a whole page at ten times is not on offer. Measured on a Nothing Phone 2,
 * eight times the fit zoom is 8.8 device pixels to the CSS pixel, which puts an A4 page
 * at 8,624 by 12,195 px, about 420 MB, in a file whose MAX_IN_FLIGHT exists because an
 * uncapped fling once took this renderer to 836 MB and had it killed twice in one
 * sitting. So only the part on screen is drawn again, and that is the whole of why this
 * is safe: a tile is bounded by the screen rather than by the page. Measured on the same
 * phone, a tile stayed at 4.4 megapixels at every zoom from 2.7 to 11.7 device pixels
 * per CSS pixel, where the page itself at the top of that range would be 186.
 *
 * None of this talks to the app. The zoom is plainly visible from inside the page
 * through visualViewport and is not visible to Kotlin at all, which has no
 * onScaleChanged and, deliberately, no JavascriptInterface. Keeping the whole of it on
 * one side of that line costs nothing here and is worth keeping.
 */

/*
 * How short of pixels a page bitmap has to be before part of it is worth drawing again.
 *
 * A quarter short is about where a shortfall starts to read as blur. Acting on any
 * shortfall at all would spend a render on a five per cent gain every time somebody
 * nudged the zoom, and a render is not free: it is a page's worth of drawing on the main
 * thread, ahead of the pages the reader is scrolling towards.
 */
var TILE_GATE = 1.25;

/*
 * How far past the visible rectangle a tile reaches, as a fraction of what is visible.
 *
 * Entirely about how often a pan costs a redraw. A fifth either way absorbs the small
 * correction that follows a pinch without the tile costing half as much again, and a pan
 * that outruns it is a deliberate move to somewhere else on the page, which is going to
 * want its own tile whatever this number says.
 *
 * It is also what keeps one rectangle the right answer here rather than a grid of them.
 * A fifth either way is 1.4 squared, about twice the screen. Okular is the one viewer
 * that implements both a viewport rectangle and a tile grid and chooses between them at
 * runtime, and its thresholds are four times the screen area to turn tiling on and three
 * to turn it back off; at twice, this sits inside the band where it would keep tiling
 * off. Raise this far enough to pass about three times the screen area and that
 * calibration is what says to think about a grid instead.
 *
 * Measured cost of the single rectangle, on a Nothing Phone 2 at 4.4 device pixels to the
 * CSS pixel: a 700 px pan takes the sharp area from 26% of the screen down to 5%, and
 * back to all of it about 350 ms after the pan stops. It never reaches nothing, because
 * the tile already up is kept until its replacement has finished drawing.
 */
var TILE_MARGIN = 0.2;

/*
 * The most bitmap one tile may hold.
 *
 * A net rather than a budget. Tiles cover disjoint parts of one screen, so however many
 * there are they come to the screen plus their margins, which on a phone is four to six
 * megapixels between them; this should not be reached there. It is here for the screen
 * that is much larger than a phone's, where the honest answer is a slightly smaller
 * margin rather than a canvas the platform will refuse to allocate.
 */
var TILE_MAX_PIXELS = 6e6;

/*
 * A ceiling on how many pages may carry a tile at once.
 *
 * It does not bind, and that is worth writing down rather than discovering again. A page
 * box plus its margin is about 1395 CSS px, and by the time the gate opens the visible
 * height is around 1600 CSS px on a phone and less on a tablet, so the list this
 * truncates has one or two pages in it and never three. It is here as a bound on a loop
 * that reads geometry, not as a memory limit that is ever reached, and the tile tests
 * deliberately do not try to exercise it.
 */
var MAX_TILES = 2;

/*
 * How long after the last movement a tile is drawn.
 *
 * Debounced, where the page counter beside this is coalesced once a frame, and the
 * difference is not an oversight. The counter has to be right during the gesture. A tile
 * drawn during a pinch is thrown away by the next frame of that pinch, so this one waits
 * for the hand to stop.
 */
var TILE_SETTLE_MS = 150;

/*
 * Let go of a tile: the render if one is still running, the element if it reached the
 * page, and the bitmap either way.
 *
 * The order matters. A cancelled render has to be told to stop before the canvas it was
 * drawing into is worth anything to reclaim, and a canvas that never reached the document
 * still holds its backing store until something zeroes it.
 */
function shed(tile) {
  if (!tile) return;
  var task = tile.task;
  tile.task = null;
  if (task) task.cancel();
  if (tile.canvas.parentNode) tile.canvas.parentNode.removeChild(tile.canvas);
  tile.canvas.width = 0;
  tile.canvas.height = 0;
}

/* Both of a page's tiles: the one on screen and the one on its way. */
function dropTile(slot) {
  shed(slot.pending);
  shed(slot.tile);
  slot.pending = null;
  slot.tile = null;
}

/*
 * Draw one, into a canvas that is not in the document yet.
 *
 * That last part is the detail worth keeping. pdf.js paints a canvas white before it
 * draws anything into it, so a tile attached while it renders is a white block over the
 * page. Attached on resolve instead, the reader looks at the stretched page bitmap until
 * the moment there is something better, which is exactly what they would have been
 * looking at if none of this existed.
 *
 * The page bitmap underneath is left alone, and so is the tile already on screen if
 * there is one, until this one is ready to take its place. Both are what stops a pan
 * from flashing back to blur on its way to being sharp again.
 */
function drawTile(req) {
  var slot = req.slot;
  /* pump() drains this queue whenever a render finishes, which is exactly when the
     bands may have moved, so a page asked for a moment ago can have been let go since. */
  if (slot.state !== "drawn" || !slot.page || !slot.unscaled) return;

  shed(slot.pending);
  /* As in draw(): the mode this patch is being drawn in, checked again when it lands. */
  var mode = inverted;
  var canvas = document.createElement("canvas");
  canvas.className = "tile";
  canvas.setAttribute("aria-hidden", "true");
  canvas.width = req.cw;
  canvas.height = req.ch;

  var tile = {
    canvas: canvas,
    x: req.x, y: req.y, w: req.w, h: req.h, k: req.k, task: null
  };
  slot.pending = tile;

  var cssScale = PAGE_WIDTH / slot.unscaled.width;
  var ctx = canvas.getContext("2d");
  tile.task = slot.page.render({
    canvasContext: ctx,
    /* A no-op in practice: a tile only ever follows a full-page render of the same page,
       and pdf.js keeps the first answer. Asked for anyway so that a tile is never the
       thing that leaves a page with no image coordinates to clip by. */
    recordImages: mode,
    viewport: slot.unscaled.clone({ scale: cssScale * req.k }),
    /*
     * pdf.js applies this outside the viewport's own transform, in canvas pixels, so a
     * plain translation is the whole of what turns a full-page render into this corner
     * of one. Leaving the scale part at 1 is deliberate: the viewport above already
     * carries it, and pdf.js reads these two numbers only to size an annotation canvas
     * this viewer never asks for.
     *
     * The page's operator list is not parsed again for this. pdf.js caches it against
     * the rendering intent rather than the scale, and holds more than one render on a
     * page at a time quite happily, refusing only two onto the same canvas. So a tile
     * is the display list run a second time, not the page read a second time.
     *
     * It is still the whole display list though, operators outside this rectangle
     * included. 5.7.284 has what is needed to skip those, on the public API:
     * `recordOperations: true` fills PDFPageProxy.recordedBBoxes, and `operationsFilter`
     * is consulted per operator. Upstream's own detail view does exactly that, in the
     * web/ layer this file does not vendor. It is left alone because the recording has to
     * be paid for on every page drawn, tiled or not, to save time on renders that only
     * happen while somebody is zoomed in. Worth revisiting if a tile ever takes long
     * enough to notice; it took about 160 ms on a Nothing Phone 2 when this was written.
     */
    transform: [1, 0, 0, 1, -req.x * req.k, -req.y * req.k]
  });
  /* Counted only once there is something to count. A render that threw on the way out
     would otherwise hold a place in MAX_IN_FLIGHT that nothing is ever going to give
     back, and the queue behind it would stop for good. */
  inFlight++;

  tile.task.promise.then(function () {
    /* Cleared here rather than at the end of the chain, so that whatever sheds this tile
       next is not cancelling a render that has already finished. */
    tile.task = null;
    if (slot.pending !== tile) { shed(tile); return; }
    slot.pending = null;
    /* Night mode moved while this was being drawn. The page under it has already been
       asked for again in the new mode, and this is a patch of the old picture. */
    if (mode !== inverted) { shed(tile); return; }
    if (mode) {
      /* The image coordinates are fractions of the whole page, and this canvas is one
         rectangle of it blown up: boxW across becomes boxW * k pixels, and the corner
         the tile starts at moves back to zero. */
      var seen = slot.pictures;
      recolour(ctx, imageQuads(
        slot.page,
        req.boxW * req.k, -req.x * req.k,
        req.boxH * req.k, -req.y * req.k
      ).filter(function (q, i) {
        /* Same source array, same order, so the page's verdicts line up. Without them,
           leave the image alone: that is the safe half of being wrong. */
        return !seen || seen[i];
      }));
    }
    canvas.style.left = String((req.x / req.boxW) * 100) + "%";
    canvas.style.top = String((req.y / req.boxH) * 100) + "%";
    canvas.style.width = String((req.w / req.boxW) * 100) + "%";
    canvas.style.height = String((req.h / req.boxH) * 100) + "%";
    /* Before the text layer, so the words stay over the picture. */
    slot.box.insertBefore(canvas, slot.text);
    shed(slot.tile);
    slot.tile = tile;
  }, function () {
    /* Cancelled, or the page would not draw. Either way the picture underneath is still
       correct and the reader is no worse off than before this file could do any of it. */
    tile.task = null;
    if (slot.pending === tile) slot.pending = null;
    shed(tile);
  }).then(function () {
    inFlight--;
    pump();
  });
}

/*
 * Work out what, if anything, is worth drawing again, and ask for it.
 *
 * Reads the geometry rather than being told it: getBoundingClientRect is in layout
 * viewport coordinates, which pinching deliberately does not move, and visualViewport's
 * offset and size are in that same space and say which part of it the reader can see. So
 * the two intersect directly, with no coordinate space in between to get wrong.
 *
 * The binary search is the same one reportPage does, for the same reason. This runs off
 * a gesture on a document that can be several hundred boxes, and asking every one of
 * them where it is would be several hundred layout reads a fifth of a second apart.
 */
function refine() {
  if (!doc || !slots.length) return;
  var vv = window.visualViewport;
  if (!vv || !(vv.width > 0) || !(vv.height > 0)) return;

  /* Anything asked for before this pass is out of date by definition. */
  tileQueue.length = 0;

  var k = liveScale();
  var i;
  if (!(k > baseScale() * TILE_GATE)) {
    /* Back at a zoom the page bitmaps cover on their own. A walk of every slot rather
       than a register of which ones are tiled: it is a property read per page, against
       the layout read per page that this function exists to avoid. */
    for (i = 0; i < slots.length; i++) dropTile(slots[i]);
    return;
  }

  var top = vv.offsetTop;
  var bottom = top + vv.height;
  var left = vv.offsetLeft;
  var right = left + vv.width;
  var middle = top + vv.height / 2;

  var lo = 0, hi = slots.length - 1, from = slots.length;
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;
    if (slots[mid].box.getBoundingClientRect().bottom > top) {
      from = mid; hi = mid - 1;
    } else {
      lo = mid + 1;
    }
  }

  var showing = [];
  for (i = from; i < slots.length; i++) {
    var r = slots[i].box.getBoundingClientRect();
    if (r.top >= bottom) break;
    showing.push({
      slot: slots[i], box: r,
      away: Math.abs(r.top + r.height / 2 - middle)
    });
  }
  /* Nearest the middle of the screen first, so that when only some of what is showing
     can be tiled it is the part being looked at rather than the part at the edge. */
  showing.sort(function (a, b) { return a.away - b.away; });
  var chosen = showing.slice(0, MAX_TILES);

  for (i = 0; i < slots.length; i++) {
    var keep = false;
    for (var c = 0; c < chosen.length; c++) if (chosen[c].slot === slots[i]) keep = true;
    if (!keep) dropTile(slots[i]);
  }

  for (i = 0; i < chosen.length; i++) {
    var slot = chosen[i].slot;
    var box = chosen[i].box;
    if (slot.state !== "drawn" || !slot.unscaled) { dropTile(slot); continue; }

    /* The visible part of this page, measured from its own top left. */
    var vx = Math.max(box.left, left) - box.left;
    var vy = Math.max(box.top, top) - box.top;
    var vw = Math.min(box.right, right) - box.left - vx;
    var vh = Math.min(box.bottom, bottom) - box.top - vy;
    if (!(vw > 0) || !(vh > 0)) { dropTile(slot); continue; }

    /* As much margin as the budget will carry, up to TILE_MARGIN. Shrinking the margin
       is the right way to come in under the cap; scaling the tile down is not, because
       the scale is the entire point of drawing it. */
    var room = Math.sqrt(TILE_MAX_PIXELS / (vw * k * vh * k));
    var m = Math.max(0, Math.min(TILE_MARGIN, (room - 1) / 2));
    var x = Math.max(0, vx - vw * m);
    var y = Math.max(0, vy - vh * m);
    var w = Math.min(box.width, vx + vw + vw * m) - x;
    var h = Math.min(box.height, vy + vh + vh * m) - y;

    /* Only if even the bare visible rectangle will not fit, which on a phone it always
       does. Then a slightly soft tile beats no tile. */
    var tk = k * within(w * k, h * k, TILE_MAX_PIXELS);

    /*
     * Snapped so the rectangle begins and ends on whole tile pixels, and the placement
     * derived back from the snapped figures rather than the other way round. Done the
     * other way the tile sits a fraction of a device pixel off the bitmap underneath it
     * and gets resampled, which is precisely the detail this is here to recover.
     */
    var px = Math.max(0, Math.floor(x * tk));
    var py = Math.max(0, Math.floor(y * tk));
    var cw = Math.min(Math.ceil((x + w) * tk), Math.floor(box.width * tk)) - px;
    var ch = Math.min(Math.ceil((y + h) * tk), Math.floor(box.height * tk)) - py;
    if (!(cw > 0) || !(ch > 0)) { dropTile(slot); continue; }
    x = px / tk; y = py / tk; w = cw / tk; h = ch / tk;

    /* What is already up, or already coming, may well cover this. Redrawing on every
       small change would have a slow pan rendering continuously and never catching up. */
    if (covers(slot.tile, vx, vy, vw, vh, tk) ||
        covers(slot.pending, vx, vy, vw, vh, tk)) continue;

    tileQueue.push({
      slot: slot, x: x, y: y, w: w, h: h, cw: cw, ch: ch, k: tk,
      boxW: box.width, boxH: box.height
    });
  }

  pump();
}

/* Whether a tile is close enough in scale and wide enough in reach to stand for what is
   visible now. The scale tolerance is what stops a pinch that drifts a few per cent from
   costing a redraw; the half pixel is against the rounding above. */
function covers(tile, vx, vy, vw, vh, k) {
  if (!tile) return false;
  if (Math.abs(tile.k - k) > tile.k * 0.15) return false;
  return tile.x <= vx + 0.5 && tile.y <= vy + 0.5 &&
    tile.x + tile.w >= vx + vw - 0.5 && tile.y + tile.h >= vy + vh - 0.5;
}

/* One pass once the reader stops, however many events they arrive with. */
var tileTimer = 0;
function scheduleRefine() {
  if (tileTimer) clearTimeout(tileTimer);
  tileTimer = setTimeout(function () { tileTimer = 0; refine(); }, TILE_SETTLE_MS);
}

/*
 * Lay the words of a page over the picture of it.
 *
 * The viewport handed in here is at CSS scale, not the canvas's device scale; see
 * the note in draw() about why those are two numbers.
 *
 * A failure here is deliberately not a failure of the page. The picture is already
 * drawn and readable, and a document whose text cannot be extracted, which is most
 * scanned ones, should look exactly as it did before this feature existed rather
 * than showing an error over a page the reader can see perfectly well.
 */
function textLayerFor(slot, page, viewport) {
  /*
   * pdf.js reads this off the container to size the glyphs. It is --total-scale-factor
   * in 5.7.284; the older --scale-factor is not read by this build at all.
   *
   * Times userUnit, and that factor is easy to miss. PageViewport keeps .scale as the
   * number it was handed and multiplies by userUnit only inside its own matrix, so the
   * viewport's width and height carry the unit while its scale does not. pdf.js's own
   * stylesheet says the same thing the long way round, as
   * calc(var(--scale-factor) * var(--user-unit)). Left out, a document declaring a
   * UserUnit gets a text layer at the wrong size against a correctly sized picture.
   * It is rare, being for pages beyond 200 inches, but that is large-format drawings
   * and maps, which is exactly the kind of document this viewer gets handed.
   */
  slot.text.style.setProperty(
    "--total-scale-factor", String(viewport.scale * (viewport.userUnit || 1)));
  var layer = new pdfjsLib.TextLayer({
    textContentSource: embedFonts(page.streamTextContent()),
    container: slot.text,
    viewport: viewport
  });
  slot.layer = layer;
  return layer.render().then(function () {
    padRows(slot.text, layer.textDivs);
  }, function () {
    if (slot.layer === layer) slot.layer = null;
    slot.text.replaceChildren();
  });
}

/*
 * A note on what is deliberately not here.
 *
 * pdf.js's viewer bounds a stray selection with an .endOfContent block that it moves
 * next to the growing end of the range on every selectionchange, and this file carried
 * a port of it. It is gone, and the stylesheet rules for it with it, because padRows()
 * below leaves nothing for it to catch: measured across the two documents from issue
 * #22, hit boxes now cover 100% of a page and 96% of the worst illustrated one, where
 * that machinery existed only to answer the uncovered part.
 *
 * It was not free, either. It ran on every selectionchange, which a finger produces
 * about fifty times a second, and moved the block in every registered layer. When that
 * churn landed in a layer above the viewport, Chromium's scroll anchoring compensated
 * and jumped the view: traced at 3418 to 2899 in a single step. Guarding the churn made
 * it cheaper; removing it makes a drag touch the DOM not at all.
 *
 * If a document ever turns up that padRows() cannot cover, the symptom is a selection
 * that freezes at a constant length while the finger keeps moving, and the answer is to
 * find the hole rather than to put this back.
 */

/*
 * Covering the page with hit boxes, so that a finger dragging a selection always has
 * a word under it. Issue #22.
 *
 * pdf.js sizes a span to its glyphs. A line box is therefore the height of the type and
 * no wider than the words on it, so the leading between lines, the space to the right
 * of a short line, the left margin and the page margins all belong to no span at all.
 * Measured here: 64% of a page was inside a span box.
 *
 * Why that is fatal rather than untidy. Every span in this layer is absolutely
 * positioned, so the layer itself has no in-flow content. When a touch lands outside
 * every span, Blink falls back to asking the container for a position, and a container
 * with nothing in flow answers the same thing wherever it is asked. Traced on a phone:
 * the selection climbed smoothly to 1002 characters, then froze for 3.7 seconds across
 * 190 consecutive events with the focus on the layer rather than a span, and then
 * jumped straight past a heading and a paragraph to 2482. It is not slow tracking, it
 * is one constant position being returned while the reader keeps moving.
 *
 * So the requirement is not "mostly covered", it is covered. The page is sampled at
 * 9,604 points in the test that settled this, and every one of them has to be inside
 * some span's box. Anything less leaves a band the drag dies in.
 *
 * A mouse never showed this because it lands where it is pointed and there is always
 * a word within a pixel or two. Upstream measures the same 64% and would freeze the
 * same way; this is a deliberate divergence, for touch.
 *
 * Padding, never geometry, so that pdf.js's own placement is untouched: padding grows a
 * box away from an edge that has already been positioned, and the negative margins put
 * the box's own edge back where the span's scaleX() lands the glyphs unmoved. Verified
 * by measuring the client rect of every span's text node before and after, which is
 * identical to the pixel.
 *
 * Gaps between lines are split half to the line above and half to the line below, so a
 * point in a gap joins whichever line it is nearer, and no single line grows a hit box
 * the height of the space before a section heading. There is no cap: a cap leaves the
 * middle of a large gap uncovered, which is the freeze again, and this was measured
 * failing at exactly that spot with a cap of two line-heights.
 *
 * The visible cost is that a selection highlight now fills the space it covers, so the
 * last line of a paragraph and a short heading are drawn full width. That is the same
 * box that has to be hittable, and it cannot be one size for the finger and another for
 * the paint without a second layer of elements.
 */
/* Rows are sorted twice, so the comparators are shared rather than a fresh closure
   per row per page. */
function byTopThenLeft(a, b) { return a.top - b.top || a.left - b.left; }
function byLeft(a, b) { return a.left - b.left; }

function padRows(container, divs) {
  var layer = container.getBoundingClientRect();
  /*
   * The three numbers this needs are already written down, so none of them is measured
   * back out of a computed style.
   *
   * pdf.js writes --scale-x and --rotate inline on each span and --min-font-size once
   * on the container; the stylesheet contract above says so. The transform it composes
   * is rotate() scaleX(--scale-x) scale(1 / --min-font-size), so a padding written here
   * is not rendered at the size it is written: sideways it is scaled by
   * --scale-x / --min-font-size, and not by --scale-x, and downwards by
   * 1 / --min-font-size. Measured on a phone, that is 1.3% for a min font size of
   * 1.013, and 8x on a WebView left at its default floor of 8. Every padding below is
   * therefore divided by the scale its own axis is drawn at.
   *
   * Getting the vertical half of that wrong is not cosmetic and is worth knowing the
   * shape of, because both symptoms look like something else. Padding that falls 1.3%
   * short leaves 1.3% of every gap uncovered, which is a hairline in a line gap and
   * 6.6px in the blank above a chapter opening, and an uncovered band is the freeze
   * this whole function exists to prevent. It also drags the words off the picture:
   * the margin below is in layout px and the padding it cancels is not, so the glyphs
   * come to rest 1.3% of the padding above where pdf.js put them, which is nothing on
   * an ordinary line and 4.7px on the one after a large gap.
   */
  var mfs = parseFloat(container.style.getPropertyValue("--min-font-size")) || 1;

  /* Read every rect before writing any padding. Interleaving the two makes the browser
     lay the page out again on each span, which on a dense page is hundreds of times. */
  var boxes = [];
  for (var i = 0; i < divs.length; i++) {
    var el = divs[i];
    /*
     * Rotated text is left alone, a span at a time rather than a page at a time.
     *
     * Everything below reads horizontal lines out of vertical positions: it groups
     * spans by their top and grows them down and sideways. On a rotated span that means
     * nothing and the padding would land across the words rather than around them. So
     * skip it, and let the rest of the page still be covered; a caption printed
     * sideways should not cost the page it sits on. A page rotated in its entirety ends
     * up padded nowhere, which is where this file was before any of it.
     */
    var rot = el.style.getPropertyValue("--rotate");
    if (rot && parseFloat(rot)) continue;
    var r = el.getBoundingClientRect();
    if (!r.height) continue;
    boxes.push({
      el: el, top: r.top, bottom: r.bottom, left: r.left, right: r.right,
      sx: (parseFloat(el.style.getPropertyValue("--scale-x")) || 1) / mfs
    });
  }
  if (boxes.length < 2) return;
  boxes.sort(byTopThenLeft);

  var rows = [];
  var row = null;
  for (var j = 0; j < boxes.length; j++) {
    var b = boxes[j];
    /* A new row when this span starts below the one before it. Two spans on the same
       line share a top to within rounding, so the tolerance is small and absolute. */
    if (!row || b.top - row.top > 2) {
      row = { top: b.top, bottom: b.bottom, items: [b] };
      rows.push(row);
    } else {
      row.bottom = Math.max(row.bottom, b.bottom);
      row.items.push(b);
    }
  }

  for (var v = 0; v < rows.length; v++) {
    var here = rows[v];
    /*
     * What this row owns, vertically. Half the gap to the row above and half the gap to
     * the row below, so a point in a gap joins whichever line it is nearer and no
     * single line grows a hit box the height of the space before a section heading.
     * The first row takes the page margin above it whole, having no row to share with,
     * and the last row takes the rest of the page.
     *
     * No cap: a cap leaves the middle of a large gap uncovered, which is the freeze
     * this exists to prevent, and it was measured failing at exactly that spot with a
     * cap of two line-heights.
     */
    var up = v ? (here.top - rows[v - 1].bottom) / 2 : here.top - layer.top;
    var floor = (v + 1 < rows.length)
      ? here.bottom + (rows[v + 1].top - here.bottom) / 2
      : layer.bottom;

    /* Left to right, so a gap belongs to the span before it, which is reading order and
       so the answer a reader expects when they land in one. Sorted in place: the rows
       were built off a top-then-left sort, so this is usually already true, but two
       spans a pixel apart vertically would come out of it the wrong way round. */
    var across = here.items;
    across.sort(byLeft);

    for (var x = 0; x < across.length; x++) {
      var it = across[x];
      var style = it.el.style;
      /* Down to its row's share of the gap, measured from this span's own bottom: a row
         can mix type sizes, a heading beside a caption, and padding each item the same
         amount from where it happens to end leaves a sliver under every short one. */
      var down = floor - it.bottom;
      if (down > 0.5) style.paddingBottom = (down * mfs).toFixed(2) + "px";
      if (up > 0.5) {
        style.paddingTop = (up * mfs).toFixed(2) + "px";
        /* Cancels the padding so the glyphs stay where pdf.js put them: the box top
           moves up by exactly what the padding pushes the text down by. Not scaled,
           where the padding above it is, because the two are in different spaces: a
           margin moves the box before the transform is applied, and the padding is
           measured inside a box the transform has already shrunk. */
        style.marginTop = (-up).toFixed(2) + "px";
      }
      /*
       * Sideways to the next span along the row, and to the page edge at its ends.
       *
       * Reaching only the two margins would leave every gap inside a row open: the
       * gutter between columns, the space between table cells, the white beside a
       * figure. And a heading reaches perhaps a sixth of the way across, so a finger
       * dragged down the middle of the column passes through the empty space beside it
       * and lands on nothing, which is why sections went on failing after paragraphs
       * were fixed.
       */
      var until = (x + 1 < across.length) ? across[x + 1].left : layer.right;
      var reach = until - it.right;
      if (reach > 1) style.paddingRight = (reach / it.sx).toFixed(2) + "px";
    }

    var first = across[0];
    var leftNeed = first.left - layer.left;
    if (leftNeed > 1) {
      first.el.style.paddingLeft = (leftNeed / first.sx).toFixed(2) + "px";
      first.el.style.marginLeft = (-leftNeed).toFixed(2) + "px";
    }
  }
}

/*
 * Keeping the page under a selection that has been dragged to the edge of it.
 *
 * A handle held against the bottom of the screen does not scroll the document, so a
 * reader can select as far as the fold and no further without letting go, scrolling,
 * and starting again. That is not a WebView shortcoming and not something this file
 * caused. Measured on a phone, Chrome for Android does the same on an ordinary page of
 * paragraphs, and so does this app's own text viewer, which lays out at device width
 * and has no text layer within reach of it.
 *
 * What does happen, and what makes dragging upward look as though it works, is Blink
 * revealing an extent that has landed outside the viewport. Drag the start handle up
 * and the line under the finger begins above the top edge, so the reveal scrolls by
 * that overshoot: one line, traced at 32 px. Drag the end handle down and there is
 * nothing to reveal, because the deepest thing the finger can be over is the last line
 * already fully on screen. Traced holding at the bottom edge: the extent sat at 1829 of
 * an 1886 px viewport and the scroll offset did not move for four seconds.
 *
 * So the scroll has to come from here, and selectionchange is the only thing to hang it
 * on. A handle drag produces no pointerdown, no pointermove and no pointerup at all -
 * the handle is a native widget and the page is never told the finger exists - and the
 * only other event of the whole gesture is a contextmenu when it comes off.
 *
 * Event driven rather than a timer, and that is the design rather than a shortcut. From
 * in here a finger held still and a finger lifted are the same thing, so a timer armed
 * at the edge would have nothing trustworthy to stop it, and it would scroll the
 * document out from under a selection that cannot follow it: scrolling alone does not
 * re-resolve the extent, which stays where it was until the finger next moves. One step
 * per change cannot run away, and cannot outrun the selection either.
 *
 * The step is how far past the band the extent landed, which is how hard the reader is
 * pushing at the edge, and it settles by itself: after each scroll the extent
 * re-resolves under the finger at the same depth, so a constant finger position gives a
 * constant speed. Measured on rustbook.pdf, 64 px a step and 1184 px across the 23
 * events of one drag held there.
 *
 * The known limit is a finger that does not move at all. Nothing re-resolves, no event
 * arrives, and the page stops - which is where this started, so the worst case is the
 * behaviour without it, and the noise a finger makes resting on glass is enough to keep
 * it going.
 *
 * The band is in dp and not in CSS px because it is a distance on a screen that a thumb
 * has to be able to land in, and this page's CSS px is whatever zoom-to-fit made it;
 * see the note in the head. Dividing by the visual viewport's scale is that conversion,
 * and it also holds the band still on the screen across a pinch.
 *
 * It reads one rect and never touches the DOM, so the note above about a drag no longer
 * mutating anything still holds. Measured across a drag on this 354 page document: 0.2
 * ms median and 0.4 ms worst.
 */
var SELECT_EDGE_DP = 50;
var SELECT_EDGE_MIN = 10;
var SELECT_GAP_MS = 700;
var selectPrevY = null;
var selectPrevT = 0;

/* The extent's own rect, not the selection's. A selection's box spans everything
   between its two ends, so by the time any of this matters its bottom is most of the
   document away; a collapsed range at the focus is the end the finger is holding. */
function extentRect(sel) {
  try {
    var r = document.createRange();
    r.setStart(sel.focusNode, sel.focusOffset);
    r.collapse(true);
    var rects = r.getClientRects();
    if (rects.length) return rects[0];
    /* An extent resolved to an element rather than into a text node has no rect of its
       own. padRows() above is what makes that rare rather than the usual case. */
    if (sel.focusNode.nodeType === 1) return sel.focusNode.getBoundingClientRect();
  } catch (e) {}
  return null;
}

function selectionEdgeScroll() {
  var sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) { selectPrevY = null; return; }
  var rect = extentRect(sel);
  if (!rect) { selectPrevY = null; return; }
  var vv = window.visualViewport;
  if (!vv || !vv.height) return;

  /* In document coordinates, so that comparing against the previous event survives the
     scrolling this function itself does between the two. */
  var y = rect.bottom + window.scrollY;
  var now = performance.now();
  var dragging = selectPrevY !== null && now - selectPrevT < SELECT_GAP_MS;
  var travel = dragging ? y - selectPrevY : 0;
  selectPrevY = y;
  selectPrevT = now;
  /* A long press is one selectionchange standing on its own, and a reader who has just
     picked a word out near the bottom of the screen has not asked for the page to move.
     The couple of px of tolerance below are for a finger pushing at an edge without
     travelling: the direction it last moved is what says which edge it wants. */
  if (!dragging) return;

  var band = SELECT_EDGE_DP / vv.scale;
  var low = vv.offsetTop + vv.height - band;
  var high = vv.offsetTop + band;
  if (travel >= -2 && rect.bottom > low) {
    window.scrollBy(0, Math.min(Math.max(rect.bottom - low, SELECT_EDGE_MIN), band));
  } else if (travel <= 2 && rect.top < high) {
    window.scrollBy(0, -Math.min(Math.max(high - rect.top, SELECT_EDGE_MIN), band));
  }
}

document.addEventListener("selectionchange", selectionEdgeScroll);

/*
 * Point the text layer at the fonts the picture was drawn with.
 *
 * This is the whole of the fix for a search highlight that stopped short of the word
 * it found. pdf.js places a run by measuring it in whatever font it is about to use
 * and dividing the width the PDF asked for by the width it got, which is the
 * --scale-x in the stylesheet contract above. That makes a run's total width exact
 * whatever font does the measuring, and it makes nothing inside the run exact: one
 * ratio for the whole run spreads the disagreement across the characters rather than
 * removing it. A Range over part of a run then lands short or long by however much
 * the two fonts differ, and searching "markerpage" highlighted "markerpag".
 *
 * How far apart the two fonts are is precisely what --scale-x records, so it also
 * measures the fix. Over the 2326 runs of a tube map that carries its own fonts, the
 * median run needed a 6.1% correction before this and 0.64% after, and the ninetieth
 * percentile fell from 21.1% to 2.4%. The correction that remains is close to a
 * constant, which one ratio removes cleanly; the one that was there before varied run
 * by run, which is the part no single ratio can fix.
 *
 * The right fonts are already here. pdf.js hands each embedded font's bytes to the
 * browser as a FontFace named after the face it loaded, waits for it inside
 * page.render(), and paints the picture with it. The text layer then ignores all of
 * that and asks for "serif". textContent.styles is keyed by exactly those loaded
 * names and every item's fontName is one of those keys, so rewriting an entry's
 * fontFamily to its own key is the whole change. The vertical offset comes along with
 * it, since the ascent pdf.js derives each span's top from is measured off that same
 * family string.
 *
 * It has to happen before the spans exist, never after. Setting font-family on a span
 * that is already built would leave the --scale-x beside it computed against a font
 * that is no longer there, which is this bug again with the sign flipped. Hence
 * editing the chunks on their way past: pdf.js merges a chunk's styles and then
 * builds that chunk's spans, so a chunk edited in flight is edited in time.
 *
 * Chunks rather than page.getTextContent(), which would also work and reads more
 * simply. streamTextContent runs at a hundred items to a chunk and getTextContent
 * collects the lot before resolving, so a page's spans would be built in one
 * synchronous pass where they are currently built a hundred at a time between worker
 * messages. On a dense page that is one long block of main thread instead of ten
 * short ones, in a file that caps MAX_IN_FLIGHT at three precisely because pdf.js
 * rasterises on the main thread.
 *
 * A key with no face keeps whatever pdf.js gave it, and that is the common case
 * rather than an edge one. A scanned page has no text and no fonts. A Type3 font has
 * no bytes to hand over. A document leaning on Helvetica without embedding it gets a
 * substitute registered under a name of pdf.js's own devising, deliberately not this
 * key, so the lookup misses and the generic stays. On a document with nothing
 * embedded this writes nothing at all, and so behaves exactly as it did before this
 * function existed.
 */
function embedFonts(stream) {
  /* Degrading is structural rather than argued: with no TransformStream nothing is
     rewritten and every page keeps the font it has today. Chromium has had it since
     67 and pdf.js already requires 125, so this will not fire. */
  if (typeof TransformStream !== "function" || !stream.pipeThrough) return stream;

  /* One walk per page rather than one per chunk. Every font this page uses is
     registered by now: the canvas render this is downstream of could not have
     finished otherwise. Deferred, so a page carrying nothing but artwork never walks
     the set at all. */
  var families = null;

  return stream.pipeThrough(new TransformStream({
    transform: function (chunk, controller) {
      var styles = chunk && chunk.styles;
      for (var key in styles) {
        var style = styles[key];
        if (!style || !style.fontFamily) continue;
        if (!families) families = loadedFamilies();
        if (!families[key]) continue;
        /*
         * Quoted, and the generic left behind it. Both halves earn their place.
         *
         * Quoted because pdf.js splices this into a canvas font shorthand, and an
         * unparseable shorthand there is not an error, it is ignored. pdf.js caches
         * the font it believes it set on a measurement canvas shared by the whole
         * document, so one name needing an escape would quietly measure that page and
         * every page after it in whatever was set last. Its own names cannot trip
         * that; quoting means no name it invents later can either.
         *
         * The generic stays as a real second choice, because a subset font is missing
         * characters constantly and one it does not carry should land on the font
         * that measures it today rather than on the platform's last resort. pdf.js
         * reads the family back off the span to build its measurement, so the string
         * that measures and the string that paints are the same string, and --scale-x
         * stays honest whichever of the two ends up drawing a given character.
         */
        style.fontFamily = '"' + key + '", ' + style.fontFamily;
      }
      controller.enqueue(chunk);
    }
  }));
}

/*
 * Which font families the browser has actually been handed, by name.
 *
 * document.fonts.check() reads like the test for this and is not one. Chromium
 * answers true for a family nobody ever registered, because the question check()
 * answers is whether the text can be drawn, and once fallback is allowed the answer
 * is always yes. Looking at what is in the set is the only honest test.
 *
 * status is checked because a face still loading is a family the browser will
 * substitute for, which is this bug rather than a smaller version of it. It cannot be
 * one of this page's own, but MAX_IN_FLIGHT lets two other pages rasterise alongside
 * and their fonts pass through this set on the way in.
 */
function loadedFamilies() {
  /* Null prototype: these keys come from another library, and a font called
     "constructor" should be a lookup rather than a surprise. */
  var families = Object.create(null);
  var set = document.fonts;
  if (!set || typeof set.forEach !== "function") return families;
  set.forEach(function (face) {
    if (face.status !== "loaded") return;
    /* FontFace.family is a CSS value that has been through the CSSOM, so a name the
       engine decided needed quoting comes back carrying the quotes. pdf.js's names
       never do, but comparing a quoted string against an unquoted key would read as a
       miss, and a miss here is the quiet kind of wrong: the page keeps today's font
       and nothing says why. */
    var name = String(face.family || "").replace(/^(["'])([\s\S]*)\1$/, "$2");
    if (name) families[name] = true;
  });
  return families;
}

/*
 * The text of a page, flattened into one string, with a way back to where each
 * piece of it came from.
 *
 * pdf.js hands out text in runs, and the runs carry the spacing of the typeset page
 * rather than of a sentence: a word can arrive split across two runs, and the gap
 * between two runs may be a space, a newline or nothing at all. Searching the raw
 * concatenation therefore misses anything that straddles a run.
 *
 * So the runs are joined with a single space between them and every stretch of
 * whitespace inside them is collapsed to one, which is what makes "Baker Street"
 * findable whichever way the typesetter broke it. "map" records, for each run, where
 * it landed in the joined string, which is what turns a match back into a Range.
 */
function flatten(runs) {
  var text = "";
  var map = [];
  for (var i = 0; i < runs.length; i++) {
    var run = String(runs[i] == null ? "" : runs[i]);
    if (!run) { map.push(null); continue; }
    if (text) text += " ";
    var cleaned = run.replace(/\s+/g, " ");
    map.push({ at: text.length, len: cleaned.length, run: i });
    text += cleaned;
  }
  return { text: text, map: map };
}

/*
 * Read the whole document's text, a page at a time, without holding onto it.
 *
 * This is the one place that touches every page, and it is why it does not run until
 * somebody actually searches: asking for all of them at open costs a round trip per
 * page on a ranged load, which is the whole reason page 1's shape stands in for the
 * rest.
 *
 * The cleanup() call is not tidiness. getPage() puts the page in pdf.js's own cache
 * and leaves it there for as long as the document is open, so walking 357 pages to
 * read their text would leave 357 page objects alive holding whatever they decoded.
 * That is the same leak blank() exists to close, arrived at from the other end, and
 * it would not show up on anything short enough to test by hand. Pages the band is
 * currently holding are left alone: blank() owns those, and cleaning one mid-render
 * would pull the artwork out from under a page being drawn.
 */
function buildIndex() {
  /* A reader can have the search box open before the document has finished
