name: Device tests

# Not on every pull request. The emulator adds ten minutes and is the flakiest
# part of any Android CI, and the tiers that run on build.yml already cover
# most of what a change can break in about five. This runs overnight and
# before anything ships.
on:
  schedule:
    # 02:47 IST, so a failure is waiting in the morning rather than mid-work. Off the
    # hour, because GitHub starts a job scheduled on the hour hours late.
    - cron: '17 21 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # Without this the emulator falls back to software and takes long enough
      # to time out the whole job.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Cold-booting an AVD is most of the runtime, and it is the same AVD
      # every night.
      - name: Cache the AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-google_apis

      - name: Create the AVD and snapshot it
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created"

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # google_apis rather than the Play Store image: pdf.js needs the
          # WebView at Chromium 125 or newer, and this image ships far past
          # that. The Play Store image is only needed if that ever stops being
          # true, and the first step below prints the version so it can be
          # checked rather than assumed.
          api-level: 36
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell am wait-for-broadcast-idle
            adb shell input keyevent 82
            echo "WebView on this image:"
            adb shell dumpsys webviewupdate | grep -i "current webview package" || true
            ./gradlew connectedDebugAndroidTest --no-daemon

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gander-device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14

  # The simple view's card, which only a WebView below pdf.js's floor shows, so only
  # PdfSimpleDeviceTest runs here. Revision 17 of this image carries WebView 109, read
  # from its product partition on 2026-10-20, and with no Play Store it never updates.
  # subFloor=required makes the card's test fail rather than skip if a later revision
  # ships one at 125 or newer. Not snapshotted: three tests don't repay 2 GB of cache.
  sub-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Simple view tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell am wait-for-broadcast-idle
            adb shell input keyevent 82
            echo "WebView on this image:"
            adb shell dumpsys webviewupdate | grep -i "current webview package" || true
            ./gradlew connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=com.arjun.gander.PdfSimpleDeviceTest -Pandroid.testInstrumentationRunnerArguments.subFloor=required

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gander-sub-floor-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
