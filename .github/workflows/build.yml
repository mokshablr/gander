name: Build

on:
  push:
    branches: [main]
  pull_request:

# Reading the repo is all either job does, so a compromised step can't write to it
permissions:
  contents: read

# A second push to a branch supersedes the first; there is no reason to keep
# building the commit nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The viewer pages are half the hand-written code and none of it is Kotlin,
  # so they are tested in a real browser rather than on a device. Runs beside
  # the Android job, not after it: neither needs the other's output.
  viewer:
    runs-on: ubuntu-latest
    # The image scripts/test-viewer-visual.sh uses, so the reference screenshots
    # are compared under the Chromium and the fonts they were made with rather
    # than whatever the runner image carries this month. The browser is in it.
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - name: Install
        run: pip install -r tests/viewer/requirements.txt

      # Including the reference screenshots, which only run on Linux: text
      # rasterises differently on macOS, so this is the one place they mean
      # anything. See tests/viewer/goldens/README.md.
      - name: Viewer tests
        run: pytest tests/viewer -q

      # The rendered page beside the golden it failed against, and the
      # difference between them. Nothing to look at unless something broke.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gander-viewer-screenshots
          path: tests/viewer/goldens/*.png
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The wrapper jar is a binary that runs before any of this repo's own
      # code does, and pull requests arrive from forks. This checks it is one
      # Gradle published rather than one somebody edited.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The MIT-licensed cache. Version 6's default is a closed-source Gradle component under
      # Gradle's Terms of Use.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Ahead of the builds: a compile error or a broken assertion should be
      # reported as such, not as a failure somewhere inside assembleRelease.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # The Kotlin style .editorconfig sets, so a change in another style is caught here
      - name: Kotlin style
        run: ./gradlew ktlintCheck

      # Against app/lint-baseline.xml, so the issues already there stay visible
      # in the report without blocking anything, and a new one fails the build.
      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Also builds the release merged manifest, which is the one that actually
      # ships, so checkReleasePermissions guards it too. Unsigned without a keystore.
      - name: Build release APK
        run: ./gradlew assembleRelease

      # Printed into the log so a tester handed the artifact link can confirm the
      # file they unzipped is the one this run produced, rather than taking it on
      # trust. GitHub rewraps artifacts in its own zip, so the hash is of the APK
      # inside, not of the download.
      - name: Checksum the debug APK
        run: shasum -a 256 app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: gander-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Only on failure, and only the reports: the HTML test report says which
      # assertion went and with what, which a log tail does not.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gander-reports
          path: app/build/reports/
          retention-days: 7
